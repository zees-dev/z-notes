# =============================================================================
# TLS — cert-manager, signed by the CLUSTER's existing private CA.
#
# WHY THIS EXISTS AT ALL: SPEC §6 encrypts secrets in the browser with
# WebCrypto, and window.crypto.subtle is only defined in a SECURE CONTEXT.
# Over plain http:// on a LAN hostname the app still works — SPEC §6/§13
# require graceful degradation — but every secret block stays armored and the
# unlock UI is replaced by a badge explaining why. HTTPS is what turns the
# secrets half of the product on.
#
# This cluster already runs a private CA for every app on it (ClusterIssuer
# `selfsigned-ca-issuer` → ai-proxy-tls, homepage-tls, filebrowser-tls, …),
# and every device on the LAN already trusts it. Minting a second, z-notes-only
# CA (the earlier revision of this file) would have meant a second trust step
# on every device for no gain — so this is ONE Certificate against the CA the
# cluster already has, exactly like its neighbours.
#
# The hostname is `znotes.home.arpa` because the LAN resolver already serves a
# `*.home.arpa` wildcard pointing at the cluster — no /etc/hosts entry needed.
# =============================================================================
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: znotes-tls
  namespace: znotes
  labels:
    app.kubernetes.io/name: z-notes
spec:
  # Traefik reads this secret because 50-ingress.yaml names it in spec.tls.
  # cert-manager rewrites it in place on renewal and Traefik picks it up live.
  secretName: znotes-tls
  duration: 2160h    # 90 days
  renewBefore: 720h  # 30 days
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - server auth
    - digital signature
    - key encipherment
  commonName: znotes.home.arpa
  dnsNames:
    - znotes.home.arpa
  issuerRef:
    name: selfsigned-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
