# =============================================================================
# TLS — cert-manager, signed by the CLUSTER's existing private CA.
#
# WHY THIS EXISTS AT ALL: the app encrypts secrets in the browser with
# WebCrypto, and window.crypto.subtle is only defined in a SECURE CONTEXT.
# Over plain http:// on a LAN hostname the app still works — graceful
# degradation is required, not optional — but every secret block stays armored
# and the unlock UI is replaced by a badge explaining why. HTTPS is what turns
# the secrets half of the product on.
#
# If your cluster already runs a private CA that every device on the LAN
# trusts (a ClusterIssuer shared by its other apps), issue against that instead
# of minting a z-notes-only CA — a second CA means a second trust step on every
# device for no gain. This file assumes such a ClusterIssuer named
# `selfsigned-ca-issuer`; point `issuerRef` at whatever yours is called.
#
# The hostname is `znotes.home.arpa` (RFC 8375's reserved name for home
# networks — see deploy/README.md §4). If your LAN resolver serves a wildcard
# for the cluster, use a name under that instead and skip the /etc/hosts entry.
# =============================================================================
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: znotes-tls
  namespace: znotes
  labels:
    app.kubernetes.io/name: z-notes
spec:
  # Traefik reads this secret because 50-ingress.yaml names it in spec.tls.
  # cert-manager rewrites it in place on renewal and Traefik picks it up live.
  secretName: znotes-tls
  duration: 2160h    # 90 days
  renewBefore: 720h  # 30 days
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - server auth
    - digital signature
    - key encipherment
  commonName: znotes.home.arpa
  dnsNames:
    - znotes.home.arpa
  issuerRef:
    name: selfsigned-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
