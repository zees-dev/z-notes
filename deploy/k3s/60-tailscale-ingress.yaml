# =============================================================================
# The CANONICAL ingress (ADR 0042) — the Tailscale Kubernetes operator.
#
# Applied by kustomization.yaml. The operator runs a proxy pod that joins your
# tailnet as a device, and Tailscale issues it a REAL, publicly-trusted
# certificate for <name>.<tailnet>.ts.net — here
# https://znotes.tailb95e62.ts.net, which is ZNOTES_ORIGIN in
# 20-deployment.yaml. Every browser on the tailnet gets a secure context with
# nothing to install: WebCrypto for the secrets half of the app, and the
# service worker, install prompt and HTTP cache of the offline half (ADR 0041)
# all require a certificate the browser trusts.
#
# Trade-off: this is reachable ONLY from the tailnet — there is no LAN hostname
# and no path in when Tailscale is down. 50-ingress.yaml + 40-certificates.yaml
# stay as the LAN break-glass (https://znotes.k3s.lan, private CA).
#
# Requires: the Tailscale operator installed, MagicDNS and HTTPS certificates
# enabled in the tailnet admin console (both are off by default), and the
# operator's OAuth client permitted to create devices with the `tag:k8s` tag.
#
#   helm repo add tailscale https://pkgs.tailscale.com/helmcharts
#   helm upgrade --install tailscale-operator tailscale/tailscale-operator \
#     -n tailscale --create-namespace \
#     --set-string oauth.clientId="<id>" --set-string oauth.clientSecret="<secret>"
#
# Another tailnet or device name changes the host below AND ZNOTES_ORIGIN AND
# the redirect in 50-ingress.yaml together.
#
# The OAuth credentials are yours to create in the Tailscale admin console —
# nothing here invents or stores one.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: znotes-tailscale
  namespace: znotes
  labels:
    app.kubernetes.io/name: z-notes
spec:
  # The operator watches for this class and provisions the tailnet device.
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: znotes
      port:
        name: http
  tls:
    # No secretName: Tailscale provisions and renews the certificate itself.
    # The host becomes <this value>.<your-tailnet>.ts.net.
    - hosts:
        - znotes
