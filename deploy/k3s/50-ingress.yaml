# =============================================================================
# Ingress — k3s's bundled Traefik terminates TLS here.
#
# Plain networking.k8s.io/v1 Ingress rather than Traefik's IngressRoute CRD, so
# the manifest survives someone running `--disable=traefik` and installing
# ingress-nginx instead. The Traefik-specific bits are annotations, which a
# different controller ignores harmlessly. deploy/k3s/alt-ingressroute.yaml has
# the CRD form if you prefer it.
#
# TWO Ingresses on purpose:
#   znotes         — websecure (:443), the real one, TLS from the cert-manager
#                    secret, backed by the Service.
#   znotes-http    — web (:80), nothing but a permanent redirect to the CANONICAL
#                    origin, https://znotes.tailb95e62.ts.net (ADR 0042). Without
#                    it, typing the bare hostname lands on a dead port and looks
#                    like the app is down. It also means nobody can accidentally
#                    use the app over an insecure origin and wonder why the
#                    secrets features degrade off outside a secure context.
#
# znotes.k3s.lan over HTTPS stays as the LAN BREAK-GLASS: the app works there,
# online, but its service worker and replica run only on the canonical origin
# (ZNOTES_ORIGIN), so it tells you where to go for offline use.
#
# >>> The three `znotes.k3s.lan` occurrences must match 40-certificates.yaml
# and what you type in the browser. The canonical name lives in
# 60-tailscale-ingress.yaml, 20-deployment.yaml (ZNOTES_ORIGIN) and the
# redirect below — change those three together.
# =============================================================================
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: znotes
  namespace: znotes
  labels:
    app.kubernetes.io/name: z-notes
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - znotes.k3s.lan
        # - znotes.<tailnet>.ts.net
      secretName: znotes-tls
  rules:
    - host: znotes.k3s.lan
      http:
        paths:
          # One prefix rule for everything. The app is a single origin: the
          # static frontend, /api/*, /events (SSE) and /healthz all live on the
          # same server, and splitting them across routers would only create
          # opportunities for /events to pick up a buffering middleware.
          #
          # SSE NOTE: Traefik streams responses and does not buffer them, so
          # /events works through this with no special configuration. Its
          # default respondingTimeouts.idleTimeout is 180s and the server's
          # heartbeat is every 20s (research §1), so the stream is never idle
          # long enough to be reaped. Do NOT attach a compress or buffering
          # middleware to this router — either one will make live updates stop
          # arriving while every request still returns 200.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: znotes
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: znotes-http
  namespace: znotes
  labels:
    app.kubernetes.io/name: z-notes
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: znotes-redirect-canonical@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: znotes.k3s.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: znotes
                port:
                  name: http
---
# The middleware referenced above. `permanent: true` makes it a 308, which
# browsers cache — the redirect is paid once per browser, not per visit.
# The @kubernetescrd suffix in the annotation is Traefik's provider namespace
# for CRD-sourced middlewares; the name is <namespace>-<name>.
#
# It is a redirectRegex, not a redirectScheme: the target is a different HOST,
# and the path and query ride along in ${1}. Single-quoted so YAML leaves the
# backslashes alone. This router matches only znotes.k3s.lan on :80, so the
# regex only ever sees that host.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-canonical
  namespace: znotes
  labels:
    app.kubernetes.io/name: z-notes
spec:
  redirectRegex:
    regex: '^http://znotes\.k3s\.lan/(.*)'
    replacement: 'https://znotes.tailb95e62.ts.net/${1}'
    permanent: true
